<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Web 展示终端</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #screen { position: fixed; inset: 0; }
  #cv { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; left: 10px; top: 10px; z-index: 2;
    font: 11px/1.5 ui-monospace, monospace; color: #9fe6ff;
    background: rgba(0,0,0,.55); padding: 6px 9px; border-radius: 6px;
    white-space: pre; pointer-events: none;
  }
  #err {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: #4a1414; color: #ffd7d3; padding: 8px 14px; border-radius: 8px;
    font-size: 13px; display: none; z-index: 3;
  }
</style>
</head>
<body>
<div id="screen"><canvas id="cv"></canvas></div>
<div id="hud"></div>
<div id="err"></div>
<script src="/geo.js"></script>
<script src="/display.js"></script>
</body>
</html>
